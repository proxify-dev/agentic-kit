[project]
name = "ak"
version = "4.3.1"
description = "The ak host: the `ak` command every kit plugin mounts its verbs into, and its own tooling (shim, gateway, hooks, moves, plugin inspect)"
requires-python = ">=3.10"
dependencies = ["rich-click", "rich", "textual>=1.0"]

# The documented gate is `uv run pytest -q`; uv includes the dev group by default, so declaring
# pytest here is what lets that literal command spawn it. ak builds alone: it names no sibling,
# because uv resolves every group and extra at lock time and a missing ../vault fails even an
# unrequested one. In a checkout `uv run --project plugins/ak ak …` still answers with every verb:
# a `module` mount reaches its plugin's own src/ (cli.py `_reach_sources`); the installed `ak`
# carries vault and memory itself (install-global.py installs the three together).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ak"]

[project.scripts]
# the `ak` CLI — its own verbs, plus every sibling plugin's `cli:` block mounted at runtime
ak = "ak.cli:main"
