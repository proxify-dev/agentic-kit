- md: '

    Agentic engineering picked up its own words fast. Some are settled across the industry, some come from one blog post,
    and some are forum slang. This page lists the ones worth knowing: what each means, who named it, and how settled it is.
    Use the right word, and follow the link when you want the original.


    Every entry links to its source. Each one was checked against that source in October 2026.


    | Label | Meaning |

    |---|---|

    | **Standard** | Several independent companies or authors use it with the same meaning. Safe to use as is. |

    | **Emerging** | Two or three credible uses. Fine to use, best with credit ("Breunig''s context clash"). |

    | **One source** | One company or author. Worth knowing; say where it comes from. |

    | **Slang** | Forum talk with no defined source. Say what you mean instead. |


    ## The context window


    Everything the agent knows when it acts sits in its context window. Most of the named problems are about what goes into
    that window and how it decays.


    ### What goes wrong

