- md: '

    ### If you see this, reach for that


    | You notice | Reach for |

    |---|---|

    | The agent gets worse as the session gets long (context rot, dumb zone) | Compaction, or a context reset with a handoff
    file |

    | The agent keeps building on a wrong idea (context poisoning) | A fresh session with a corrected prompt, not more arguing
    in the same one |

    | Too many tools, and it picks the wrong one (context confusion) | Tool loadout or tool search |

    | Instructions contradict each other (context clash) | One rule in one place; prune the rest |

    | Exploration output floods the session (context pollution) | A sub-agent that returns only the summary |

    | The instructions file keeps growing | Progressive disclosure: a short root file that points to detail |


