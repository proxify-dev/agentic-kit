  meaning: 'Using a tool or an action to cut the thinking a task needs: a phone reminder, a calculator, now an AI. Risko and
    Gilbert: ''the use of physical action to alter the information processing requirements of a task so as to reduce cognitive
    demand.'' Shaw: ''Cognitive offloading is strategic delegation. You remain in control of the decision, but you choose
