    papers often use it for over-reliance instead, e.g. Aiersilan, ''The Vibe-Check Protocol: Quantifying Cognitive Offloading
    in AI Programming'' (arXiv 2601.02410, 2026-01-02), which contrasts students ''leveraging AI for acceleration versus those
    using it for cognitive offloading''.'
