- md: '

    ## Where the experts disagree


    These are open questions. Know both sides before you pick one.


    - **Keep failed attempts in the context, or clear them?** Manus keeps errors in so the model learns from them. Anthropic
    says that after two failed corrections you should `/clear` and write a better prompt.

    - **Remove tools, or hide them?** Manus never adds or removes tools mid-task; it blocks the ones not allowed at decoding
    time. Tool loadout and Anthropic''s tool search load fewer tools instead.

    - **Sub-agents, or one agent?** Anthropic recommends sub-agents to keep context clean. Cognition argues "Don''t build
    multi-agents": keep one thread that sees the full history.

    - **Compact, or hand off?** Amp dropped compaction for handoffs in late 2025, then brought it back in 2026.


    ## Words with more than one meaning


    - **Harness**: the agent harness (everything around the model), an eval harness, or a test harness. Say which.

    - **Plan mode**: a product mode (plan, approve, then edit), "plan-then-execute" (a security pattern), or LangChain''s
    planner-and-executor agents.

    - **Hooks**: lifecycle scripts in Claude Code, event automations in Kiro, middleware in LangChain.

    - **Compaction**: usually summarising the session. Manus uses it for swapping tool results for file pointers.

    - **Context confusion**: Breunig''s meaning is too much irrelevant content, usually too many tools. It does not mean the
    agent mixing up which task it is on.

    - **Cognitive offloading**: in psychology, handing a piece of thinking to a tool while you keep the decision. Many AI
    papers use it for letting the AI do the thinking, which Shaw and Nave (Wharton, 2026) call cognitive surrender. Neither
    is context offloading, which moves the agent''s memory into files.


    ## Slang you''ll hear


    | You hear | What people mean | Say instead |

    |---|---|---|

    | "It got lobotomized" | Either the agent forgot your rules after auto-compaction, or a new model release feels dumber.
    | Context rot or context collapse for the first; name the release and the behaviour for the second. |

    | "Babysitting the agent" | Spending your time watching and correcting it instead of building. | Missing backpressure:
    add the checks that let it catch its own mistakes. |

    | "Boxing the agent" | AI boxing is an AI-safety idea about containing a superintelligence. It is not a prompting term.
    | Sandboxing, least privilege. |

    '
