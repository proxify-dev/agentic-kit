# Substrate v15 · vocabulary: the industry's named problems and moves, one entry per term, each sourced
# and graded (standard · emerging · single-source · folk). THE home of every term: challenges and
# practices point here with `vocab:`, the public page /reference/vocabulary is built from this file
# (tools/publish.py), tools/check.py keeps the copies honest. Imported 2026-11-03 from the 10-26/10-27
# research (tools/vocab_import.py); edit here from now on.
terms:
- id: context-rot
  term: context rot
  kind: problem
  family: context
  grade: standard
  year: '2025'
  meaning: 'A model''s accuracy and recall degrade as the number of tokens in its context grows, so more context is not automatically
    better. Anthropic: ''As token count grows, accuracy and recall degrade, a phenomenon known as context rot''.'
  who: Hacker News user Workaccount2 (comment of 2025-06-18; Simon Willison replied 'I think you just coined context rot').
    Measured by Chroma (Kelly Hong, Anton Troynikov, Jeff Huber, 2025-07-14, 18 models), whose report uses the term only in
    its title. Defined in Anthropic's docs and engineering post (2025-09-29).
  source: https://news.ycombinator.com/item?id=44310054
  checked_against_source: true
  also_called:
  - context degradation
  - long-context degradation
  fixed_by:
  - compaction
  - intentional compaction
  - context reset
  - sub-agent architectures (context isolation)
  - tool result clearing (context editing)
  - structured note-taking (agentic memory)
  - context pruning
  - context offloading
  - smallest set of high-signal tokens
  - just-in-time context retrieval
  - progressive disclosure
  - RAG (as a context fix)
  - context engineering
  - write, select, compress, isolate
  - own your context window
  - context folding
  - Recursive Language Models (RLMs)
  - sleep-time compute
  - Ralph Wiggum technique (Ralph loop)
  imported_from: research-2026-10-26.json
  page:
    label: Context rot
    link: https://www.trychroma.com/research/context-rot
    text: The more tokens in the context, the worse the model recalls and reasons. More context is not automatically better.
    named_by: A Hacker News comment (June 2025), measured by Chroma, defined by Anthropic
- id: lost-in-the-middle
  term: lost in the middle
  kind: problem
  family: context
  grade: standard
  year: '2023'
  meaning: Language model performance is often highest when the relevant information sits at the beginning or end of the input.
    It degrades significantly when that information sits in the middle of a long context, even for explicitly long-context
    models.
  who: 'Nelson F. Liu, Kevin Lin, John Hewitt, Ashwin Paranjape, Michele Bevilacqua, Fabio Petroni, Percy Liang (TACL 2023).
    The labels U-shaped, primacy and recency come from later writers. This is a different measured effect from context rot:
    Chroma found no position effect in its own setup.'
  source: https://arxiv.org/abs/2307.03172
  checked_against_source: true
  also_called:
  - U-shaped attention curve
  - positional bias (primacy and recency)
  fixed_by:
  - recitation (todo.md)
  - context engineering
  - placing critical information at the start or end of the prompt
  imported_from: research-2026-10-26.json
  page:
    label: Lost in the middle
    link: https://arxiv.org/abs/2307.03172
    text: Facts at the start or end of a long input get used; facts in the middle get missed.
    named_by: Liu et al., 2023
- id: context-poisoning
  term: context poisoning
  kind: problem
  family: context
  grade: emerging
  grade_note: one researcher and the checker rate it standard
  year: '2025'
  meaning: A hallucination or other error gets into the context. The model refers back to it again and again, and it keeps
    steering the model.
  who: Google DeepMind's Gemini 2.5 team, in the Gemini Plays Pokemon section of the technical report (arXiv 2507.06261).
    Drew Breunig generalised it as a failure mode and popularised it (2025-06-22). Adopted by LangChain, Simon Willison and
    OpenAI's Agents SDK cookbook. Not the same as trajectory poisoning.
  source: https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html
  checked_against_source: true
  also_called: []
  fixed_by:
  - sub-agent architectures (context isolation)
  - context pruning
  - context reset
  - context engineering
  - compaction (only with a clean summary; a bad fact in a summary keeps poisoning)
  imported_from: research-2026-10-26.json
  page:
    label: Context poisoning
    link: https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html
    text: A wrong fact or hallucination gets into the context, and the model keeps building on it.
    named_by: Gemini 2.5 report; Drew Breunig, 2025
- id: context-distraction
  term: context distraction
  kind: problem
  family: context
  grade: emerging
  year: '2025'
  meaning: A context grows so long that the model over-focuses on the context and neglects what it learned during training.
  who: Drew Breunig (2025-06-22). LangChain ('When the context overwhelms the training') and Willison adopted it, citing him.
    Not the same as Chroma's 'distractors'.
  source: https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html
  checked_against_source: true
  also_called: []
  fixed_by:
  - compaction
  - context offloading
  - context pruning
  - context reset
  - sub-agent architectures (context isolation)
  - programmatic tool calling
  - context engineering
  imported_from: research-2026-10-26.json
  page:
    label: Context distraction
    link: https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html
    text: The context grows so long that the model leans on it and neglects what it learned in training.
    named_by: Drew Breunig, 2025
- id: context-confusion
  term: context confusion
  kind: problem
  family: context
  grade: emerging
  year: '2025'
  meaning: 'The model uses superfluous content in the context to generate a low-quality response. Breunig''s main evidence
    is too many tool definitions: the Berkeley Function-Calling Leaderboard, and a GeoEngine study where a quantized Llama
    3.1 8b failed with 46 tools and succeeded with 19. It does not mean the agent is confused about which task or project
    it is on.'
  who: Drew Breunig, 'How Long Contexts Fail' (2025-06-22), restated in 'How to Fix Your Context' (2025-06-26). Lance Martin/LangChain,
    Simon Willison, O'Reilly Radar and Redis repeat it and credit him. Anthropic, OpenAI, Google, Chroma and academic papers
    do not use it.
  source: https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html
  checked_against_source: true
  also_called: []
  fixed_by:
  - tool loadout
  - Tool Search Tool (deferred tool loading)
  - progressive disclosure
  - RAG (as a context fix)
  - context pruning
  - sub-agent architectures (context isolation)
  - smallest set of high-signal tokens
  - just-in-time context retrieval
  - right altitude
  - context engineering
  imported_from: research-2026-10-26.json
  page:
    label: Context confusion
    link: https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html
    text: Extra content, most often too many tool definitions, drags the answer down.
    named_by: Drew Breunig, 2025
- id: context-clash
  term: context clash
  kind: problem
  family: context
  grade: emerging
  year: '2025'
  meaning: New information and tools added to the context conflict with information already in it.
  who: Drew Breunig (2025-06-22). He builds it on Laban et al. (arXiv 2505.06120), who found an average 39% drop when prompts
    are split across turns. LangChain lists it and Willison quotes it.
  source: https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html
  checked_against_source: true
  also_called: []
  fixed_by:
  - context pruning
  - sub-agent architectures (context isolation)
  - context engineering
  - single-threaded agents with shared full traces (Cognition)
  imported_from: research-2026-10-26.json
  page:
    label: Context clash
    link: https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html
    text: New information conflicts with what is already in the context.
    named_by: Drew Breunig, 2025
- id: lost-in-conversation
  term: lost in conversation
  kind: problem
  family: context
  grade: emerging
  year: '2025'
  meaning: When an LLM takes a wrong turn in a multi-turn conversation, it gets lost and does not recover. It makes assumptions
    early and attempts final answers too soon, then over-relies on them. The study measured an average 39% drop versus single-turn
    prompts.
  who: Philippe Laban, Hiroaki Hayashi, Yingbo Zhou, Jennifer Neville, 'LLMs Get Lost In Multi-Turn Conversation' (2025-05-09).
    'Lost in conversation' is the name of the code repository.
  source: https://github.com/microsoft/lost_in_conversation
  checked_against_source: true
  also_called:
  - LLMs get lost in multi-turn conversation
  fixed_by:
  - context reset
  - consolidating requirements into a fresh single-turn prompt
  imported_from: research-2026-10-26.json
  page:
    label: Lost in conversation
    link: https://github.com/microsoft/lost_in_conversation
    text: One wrong turn early in a multi-turn session and the model rarely recovers. The study measured a 39% average drop versus
      one complete prompt.
    named_by: Laban et al. (Microsoft), 2025
- id: context-pollution
  term: context pollution
  kind: problem
  family: context
  grade: emerging
  year: '2025'
  meaning: Irrelevant or stale content builds up in the context window, such as unrelated tasks or failed approaches, and
    degrades the model's output.
  who: 'No known coiner. Anthropic uses it descriptively without defining it: in its engineering post (2025-09-29) and in
    the Claude Code docs (''Context is polluted with failed approaches''). Per the checker, Phil Schmid (Dec 2025) and Liip
    (Mar 2026) define it independently.'
  source: https://www.philschmid.de/context-engineering-part-2
  checked_against_source: true
  also_called:
  - polluted context
  fixed_by:
  - compaction
  - structured note-taking (agentic memory)
  - sub-agent architectures (context isolation)
  - context reset
  imported_from: research-2026-10-26.json
  page:
    label: Context pollution
    link: https://www.philschmid.de/context-engineering-part-2
    text: Irrelevant or stale content, such as failed attempts and unrelated tasks, piles up and degrades the output.
    named_by: No single author; used by Anthropic
- id: attention-budget
  term: attention budget
  kind: problem
  family: context
  grade: emerging
  year: '2025'
  meaning: LLMs have an attention budget that they draw on when parsing large volumes of context, and every new token depletes
    it by some amount. Anthropic grounds the idea in the transformer's n-squared pairwise relationships being stretched thin.
  who: Anthropic Applied AI team (Prithvi Rajasekaran, Ethan Dixon, Carly Ryan, Jeremy Hadfield), 2025-09-29.
  source: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
  checked_against_source: true
  also_called:
  - n-squared pairwise relationships stretched thin
  fixed_by:
  - smallest set of high-signal tokens
  - just-in-time context retrieval
  - compaction
  - context engineering
  imported_from: research-2026-10-26.json
  page:
    label: Attention budget
    link: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
    text: The model has a limited budget of attention, and every token spends some of it.
    named_by: Anthropic, 2025
- id: attention-dilution
  term: attention dilution
  kind: problem
  family: context
  grade: emerging
  year: '2026'
  meaning: As context grows, attention is spread over more tokens, which starves the content tokens that matter. One paper
    defines it as 'the starvation of content tokens in the attention distribution'.
  who: Unknown. The earliest uses found are in Shangding Gu, 'Long Context, Less Focus' (arXiv 2602.15028, 2026-02-16), and
    Pei et al., FocuSFT (arXiv 2605.09932, 2026-05-11). The first is about inference and the second about training, so the
    two papers use the term somewhat differently.
  source: https://arxiv.org/abs/2605.09932
  checked_against_source: true
  also_called:
  - diluted attention
  - long context, less focus
  fixed_by:
  - context pruning
  - dilution-aware fine-tuning (FocuSFT)
  imported_from: research-2026-10-26.json
- id: real-context-size
  term: real context size (claimed versus effective context length)
  kind: problem
  family: context
  grade: standard
  year: '2024'
  meaning: 'Effective context length is the longest input at which a model still performs above a quality threshold. It is
    often far below the context length the model claims or was trained on: RULER tested 17 models and found only half held
    up at 32K.'
  who: No single coiner. RULER (Hsieh et al., NVIDIA, 2024-04-09) popularised measuring claimed against effective length,
    and An et al. (2024-10-24) use 'effective context length' in their title.
  source: https://github.com/NVIDIA/RULER
  checked_against_source: true
  also_called:
  - effective context length
  - RULER
  fixed_by:
  - evals
  - RULER benchmark (measures it)
  imported_from: research-2026-10-26.json
- id: context-anxiety
  term: context anxiety
  kind: problem
  family: context
  grade: emerging
  year: '2025'
  meaning: A model that knows the size of its own context window takes shortcuts or wraps tasks up early because it believes
    it is near the end of the window, even when plenty of room is left.
  who: Cognition (the Devin team), in 'Rebuilding Devin for Claude Sonnet 4.5' (2025-09-29). Adopted by Inkeep (2025-10-03)
    and in Anthropic's harness post (2026-03-24). A 2026 ICML paper (arXiv 2607.21616) calls it 'informally known as context
    anxiety'.
  source: https://cognition.com/blog/devin-sonnet-4-5-lessons-and-challenges
  checked_against_source: true
  also_called: []
  fixed_by:
  - context reset
  - compaction
  - structured note-taking (agentic memory)
  - enable the 1M-token window but cap usage at 200k (Cognition)
  - reminders at the start and end of the prompt
  - tell the model its context will be compacted and not to stop early
  imported_from: research-2026-10-26.json
  page:
    label: Context anxiety
    link: https://cognition.com/blog/devin-sonnet-4-5-lessons-and-challenges
    text: A model that knows its window size rushes or wraps up early, believing it is near the end when it isn't.
    named_by: Cognition (Devin), 2025
- id: dumb-zone
  term: dumb zone
  kind: problem
  family: context
  grade: emerging
  year: '2025'
  meaning: The stretch of a filled-up context window where a coding agent's decisions get noticeably worse. In that stretch
    it starts doing increasingly stupid things, such as deleting your .env file. The low-utilisation counterpart is the smart
    zone.
  who: Attributed to Dex Horthy (HumanLayer), who introduced it jokingly in his AI Engineer Code 2025 talk 'No Vibes Allowed'.
    No fetched source states that he coined it. He credits Geoff Huntley for the idea that the more of the window you use,
    the worse the outcomes.
  source: https://ai.engineer/talks/rmvDxxNubIg-context-engineering-for-complex-codebases
  checked_against_source: true
  also_called:
  - smart zone (counterpart)
  fixed_by:
  - intentional compaction
  - context reset
  - sub-agent architectures (context isolation)
  - tool loadout
  - keep context utilisation low (Horthy's ~40% heuristic, a feel not a measured constant)
  imported_from: research-2026-10-26.json
  page:
    label: Dumb zone
    link: https://ai.engineer/talks/rmvDxxNubIg-context-engineering-for-complex-codebases
    text: Past a certain fill level, the agent's decisions get noticeably worse.
    named_by: Dex Horthy (HumanLayer), 2025
- id: trajectory-poisoning
  term: trajectory poisoning
  kind: problem
  family: context
  grade: single-source
  year: '2026'
  meaning: The agent falls into a pattern of doing things you do not want. After repeated mistakes, the model computes that
    the most probable next message is another mistake. Replies such as 'You're completely right!' are a symptom.
  who: Gergely Orosz's write-up of Dex Horthy (2026-07-15). The wording may be Orosz's.
  source: https://newsletter.pragmaticengineer.com/p/context-engineering-with-dex-horthy
  checked_against_source: true
  also_called: []
  fixed_by:
  - context reset
  - intentional compaction
  imported_from: research-2026-10-26.json
- id: summary-drift
  term: summary drift
  kind: problem
  family: context
  grade: single-source
  year: unknown
  meaning: When history is compressed into a summary, facts get reinterpreted or altered, so errors can compound across repeated
    summarisation.
  who: Unknown. The exact phrase appears in OpenAI's Agents SDK cookbook (undated). Factory Research (2025-12-16) calls the
    same effect 'silent drift'.
  source: https://developers.openai.com/cookbook/examples/agents_sdk/session_memory
  checked_against_source: true
  also_called:
  - silent drift (Factory)
  - context distortion
  - compaction loss (not a coined term)
  fixed_by:
  - anchored iterative summarization
  - context pruning
  - context reset
  - evals
  - tailored compression prompts
  imported_from: research-2026-10-26.json
- id: context-collapse
  term: context collapse
  kind: problem
  family: context
  grade: single-source
  year: '2025'
  meaning: When an LLM repeatedly rewrites an accumulated context, details erode over time and the context degrades into shorter,
    less informative summaries.
  who: Qizheng Zhang et al., 'Agentic Context Engineering' (arXiv 2510.04618, 2025-10-06; ICLR 2026). Unrelated to 'model
    collapse'.
  source: https://arxiv.org/abs/2510.04618
  checked_against_source: true
  also_called:
  - brevity bias (sibling term from the same paper)
  fixed_by:
  - Agentic Context Engineering (ACE)
  - anchored iterative summarization
  - incremental delta updates
  imported_from: research-2026-10-26.json
  page:
    label: Context collapse
    link: https://arxiv.org/abs/2510.04618
    text: Summarising a context again and again erodes the details until little useful is left.
    named_by: Zhang et al. (ACE paper), 2025
- id: lobotomization
  term: lobotomization (post-compaction)
  kind: problem
  family: context
  grade: folk
  year: '2026'
  meaning: After auto-compaction, a coding agent loses track of which repo it is in, forgets constraints you set and drops
    skills it had invoked, so session quality falls immediately.
  who: 'Unknown; community slang. Ian L. Paterson (2026-03-25, updated 2026-08-15) reports ''The community calls this lobotomization''.
    The behaviour is documented in Claude Code issue #24460 (2026-02-09): /compact summarises CLAUDE.md rules along with the
    conversation, and they may be lost. The issue was closed as not planned.'
  source: https://ianlpaterson.com/blog/stop-claude-code-from-lobotomizing-itself-mid-task/
  checked_against_source: true
  also_called:
  - post-compaction amnesia
  - context amnesia
  - instruction amnesia
  fixed_by:
  - context reset
  - structured note-taking (agentic memory)
  - sub-agent architectures (context isolation)
  - hooks
  - disable auto-compact
  - manual /compact with explicit instructions
  - statusline context monitoring
  imported_from: research-2026-10-26.json
- id: instruction-drift
  term: instruction drift
  kind: problem
  family: context
  grade: single-source
  grade_note: '''context drift'' is folk'
  year: '2024'
  meaning: A model follows its initial instructions less and less as a conversation or session grows, even though the instructions
    are still in context. Li et al. report significant drift within eight rounds and tie it to attention decay. Bui's name,
    instruction fade-out, describes the model progressively deprioritising initial instructions as history grows.
  who: '''Instruction drift'': Kenneth Li, Tianle Liu, Naomi Bashkansky, David Bau, Fernanda Viegas, Hanspeter Pfister, Martin
    Wattenberg (arXiv 2402.10962, 2024-02-13; COLM 2024; first framed as ''persona drift''). ''Instruction fade-out'': Nghi
    D. Q. Bui''s OPENDEV paper (arXiv 2603.05344, 2026-03-05), defined by agentpatterns.ai. ''Context drift'': practitioner
    usage with no coiner, also used for state lost between sessions. No settled name exists.'
  source: https://arxiv.org/abs/2402.10962
  checked_against_source: true
  also_called:
  - instruction fade-out
  - prompt fade
  - persona drift
  - context drift (folk)
  - context degradation syndrome (James Howard, 2024-11-26)
  - instruction (in)stability
  fixed_by:
  - context reset
  - event-driven system reminders (re-inject instructions)
  - split-softmax (attention reweighting)
  - CLAUDE.md anchoring and checkpoints
  imported_from: research-2026-10-26.json
- id: goal-drift
  term: goal drift
  kind: problem
  family: context
  grade: emerging
  year: '2025'
  meaning: An agent's tendency to deviate from its original objective over time. Arike et al. find that it correlates with
    growing susceptibility to pattern-matching as context length grows.
  who: Rauno Arike, Elizabeth Donoway, Henning Bartsch, Marius Hobbhahn (arXiv 2505.02709, 2025-05-05; AIES 2025). Follow-ups
    by other authors reuse the term (arXiv 2603.03258, 2603.03456).
  source: https://arxiv.org/abs/2505.02709
  checked_against_source: true
  also_called:
  - inherited goal drift
  - asymmetric goal drift
  fixed_by:
  - recitation (todo.md)
  - context reset
  - instruction hierarchy
  - agent harness
  imported_from: research-2026-10-26.json
  page:
    label: Goal drift
    link: https://arxiv.org/abs/2505.02709
    text: Over a long run, the agent wanders away from its original objective.
    named_by: Arike et al., 2025
- id: agent-drift
  term: agent drift
  kind: problem
  family: context
  grade: single-source
  year: '2026'
  meaning: The progressive degradation of agent behavior, decision quality and inter-agent coherence over extended interaction
    sequences.
  who: Abhishek Rath (independent researcher), arXiv 2601.04170, 2026-01-07. The results come from simulation and the researchers
    read only the abstract.
  source: https://arxiv.org/abs/2601.04170
  checked_against_source: true
  also_called:
  - behavioral degradation
  fixed_by: []
  imported_from: research-2026-10-26.json
- id: instruction-induction-conflict
  term: instruction-induction conflict
  kind: problem
  family: context
  grade: single-source
  year: '2026'
  meaning: In a long conversation, the user's instruction can compete with the pattern set by earlier assistant turns. When
    it does, the model switches from following the instruction to continuing the pattern.
  who: Carolina Camassa and Derek Shiller (arXiv 2605.20382, 2026-05-19; poster at the COLM 2026 Sci-FM workshop).
  source: https://arxiv.org/abs/2605.20382
  checked_against_source: true
  also_called:
  - instruction-following to pattern-following transition
  fixed_by:
  - context reset
  - varied, multi-token outputs
  - chain-of-thought (helps but does not remove it)
  imported_from: research-2026-10-26.json
- id: context-inertia
  term: context inertia
  kind: problem
  family: context
  grade: single-source
  year: '2026'
  meaning: The model commits to a hypothesis, subtask or goal in its context and keeps pursuing it after the evidence says
    to stop or change course.
  who: Drew Breunig, 2026-10-14. He says compaction alone does not fix it. Nobody checked whether the works he cites use the
    term themselves.
  source: https://www.dbreunig.com/2026/10/14/context-inertia.html
  checked_against_source: true
  also_called: []
  fixed_by:
  - context reset
  - sub-agent architectures (context isolation)
  - context offloading
  imported_from: research-2026-10-26.json
- id: kitchen-sink-session
  term: kitchen sink session
  kind: problem
  family: context
  grade: single-source
  year: unknown
  meaning: You start with one task, ask something unrelated, then return to the first task. The context is left full of irrelevant
    information.
  who: Anthropic, in the Claude Code best-practices docs, next to its sibling anti-patterns 'Correcting over and over' and
    'The infinite exploration'.
  source: https://code.claude.com/docs/en/best-practices
  checked_against_source: true
  also_called: []
  fixed_by:
  - context reset
  - sub-agent architectures (context isolation)
  imported_from: research-2026-10-26.json
  page:
    label: Kitchen sink session
    link: https://code.claude.com/docs/en/best-practices
    text: One session for unrelated tasks, so each task's leftovers crowd the next.
    named_by: Anthropic, Claude Code docs
- id: context-engineering
  term: context engineering
  kind: move
  family: context
  grade: standard
  year: '2025'
  meaning: The set of strategies for curating and maintaining the optimal set of tokens (information) during LLM inference
    (Anthropic). Karpathy calls it 'the delicate art and science of filling the context window with just the right information
    for the next step'.
  who: 'Contested; no single coiner. The Pragmatic Engineer asserts Dex Horthy coined it. Horthy himself recalls posting 12-Factor
    Agents around 2025-04-03 and calls Jeff Huber a ''secret co-creator''; he does not claim coinage. Earliest dated uses
    verified: Walden Yan/Cognition 2025-06-12, Tobi Lütke 2025-06-19, Harrison Chase 2025-06-23, Andrej Karpathy 2025-06-25.'
  source: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
  checked_against_source: true
  also_called:
  - context engineering vs prompt engineering
