# Substrate v15 · claude-code: what Claude Code itself writes, the same way on every laptop. The setup scan may count
# only what this file lists. A person's own tools (their modes, plugins, memory or search tools) are never matched by
# name or by the text they print: they are credited through `own:` below, by what git says the person wrote.
#
# Why (his ruling 11-04): "we cannot fine-tune this tool against my own personal setup that others wouldn't have unless
# it's a built-in from Claude Code." The scan had matched the reminder text of one person's own plugins
# (an orchestration command, memory and session-search tools) and those tools' names.
# On any other laptop those count 0.
#
# How "built in" is decided: by the Claude Code program, not by one laptop's logs. Commands are the ones the program
# registers (`{type:"local"|"local-jsx"|"prompt", name:…}`), agent types the ones it marks `source:"built-in"`, texts the
# fixed sentences found inside it. Read from ~/.local/share/claude/versions/2.1.318 on 2026-11-04. A name the program
# doesn't contain is a plugin's or a person's. Regenerate the lists at the bottom, and check every `match:` text above is
# still inside the program: `uv run python -I labs/v15/tools/claude_code_builtins.py` (`--check` only reports).
#
# Fields:
#   match     how the scan spots it in the logs; code reads the pattern from here instead of typing its own
#   means     what it is, in plain words; `not` = what it gets mistaken for
#   who_acts  who makes it happen: person (Claude Code writes it only when a person acts) · claude · setup (a hook, rule
#             file or agent did it; whose is decided by `own:`) · either. A card's group must agree with it.
#   checked   a real record was looked at: by whom and where. null = no card may count it yet.
#   seen_in   the Claude Code versions it was found in. Members run older versions: an entry missing from theirs reads
#             "can't tell", never 0.
version: 1
read_from: {claude_code: 2.1.318, date: '2026-11-04', how: names registered inside the program}

# ---------------------------------------------------------------- records and attachments the cards count
records:
- id: rec.user_typed
  kind: record
  match: {type: user, not: [isMeta, tool_result, isSidechain]}
  means: A message a person typed in an interactive session.
  who_acts: person
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: rec.entrypoint
  kind: field
  match: {field: entrypoint}
  means: How the session was started (cli, vscode, jetbrains, desktop, sdk-cli, sdk-py, sdk-ts).
  not: sdk-* is a program, not a person typing.
  who_acts: either
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: att.agent_mention
  kind: attachment
  match: {attachment_type: agent_mention}
  means: The person @-mentioned a sub-agent by name.
  who_acts: person
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: att.skill_mention
  kind: attachment
  match: {attachment_type: skill_mention}
  means: The person typed /skill-name inside a message.
  not: An @-mention. Claude Code writes no skill record for @.
  who_acts: person
  checked: {by: card audit 11-04, session: 4cbb3ff3, commit: dd76d2e8}
- id: att.file
  kind: attachment
  match: {attachment_type: file, minus: att.compact_file_reference}
  means: A file attached to the person's message, after leaving out the files /compact re-attaches.
  not: Every file attachment. 159 of 178 on his laptop were re-attached after /compact.
  who_acts: person
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: att.compact_file_reference
  kind: attachment
  match: {attachment_type: compact_file_reference}
  means: A file Claude Code put back into context after a compaction.
  who_acts: claude
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: att.workflow_keyword_request
  kind: attachment
  match: {attachment_type: workflow_keyword_request}
  means: The person typed the workflow keyword ("ultracode").
  not: That a workflow ran.
  who_acts: person
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: att.hook_additional_context
  kind: attachment
  match: {attachment_type: hook_additional_context}
  means: A hook put text into Claude's context. Whose hook is decided by own.hook, never by the text.
  who_acts: setup
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: att.hook_blocking_error
  kind: attachment
  match: {attachment_type: hook_blocking_error}
  means: A hook blocked a tool call.
  not: The person's own hook. Installed plugins block too; own.hook decides.
  who_acts: setup
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: att.nested_memory
  kind: attachment
  match: {attachment_type: nested_memory}
  means: A rule file from a subfolder (CLAUDE.md below the repo root) loaded because Claude worked there.
  not: The person's own rule file; own.rule_file decides.
  who_acts: setup
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: att.plan_mode
  kind: attachment
  match: {attachment_type: [plan_mode, plan_mode_exit]}
  means: Plan mode was on for a turn, or was left.
  who_acts: either
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: rec.permission_mode
  kind: record
  match: {type: permission-mode}
  means: The session's permission mode changed (default, plan, acceptEdits, auto…).
  who_acts: either
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: rec.agent_setting
  kind: record
  match: {type: agent-setting}
  means: The session runs as a named agent (claude --agent …).
  who_acts: person
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: sys.compact_boundary
  kind: system
  match: {subtype: compact_boundary, field: compactMetadata.trigger}
  means: A compaction; trigger says manual (the person typed /compact) or auto.
  who_acts: either
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: sys.scheduled_task_fire
  kind: system
  match: {subtype: scheduled_task_fire}
  means: A Claude Code scheduled task started a turn.
  who_acts: setup
  checked:
- id: fld.is_fork
  kind: field
  match: {field: isFork, without: toolUseId}
  means: A sub-agent the person forked (/subtask, /fork, /btw); Claude's own sub-agent calls carry toolUseId.
  who_acts: person
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: fld.run_in_background
  kind: field
  match: {tool_input: run_in_background}
  means: Claude left a shell command or a sub-agent running in the background.
  not: requestShape, which the scan used before 11-04.
  who_acts: claude
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: fld.background_task
  kind: field
  match: {field: toolUseResult.backgroundTaskId, on: tool.bash}
  means: A background shell command got a task id; Claude Code writes a <task-notification> with the task's final status when it ends.
  not: A background command Claude never came back to, or that TaskStop killed.
  who_acts: claude
- id: fld.tool_denial_kind
  kind: field
  match: {field: toolDenialKind, value: user-rejected}
  means: The person rejected a tool call Claude asked to make.
  who_acts: person
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: fld.permission_mode
  kind: field
  match: {field: permissionMode, on: rec.user_typed}
  means: The permission mode in force when the person typed each message (plan, default, acceptEdits, auto…).
  who_acts: either
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: fld.session_kind_bg
  kind: field
  match: {field: sessionKind, value: bg}
  means: A session sent to the background (/bg, /background).
  who_acts: person
  checked: {by: card audit 11-04, commit: e7f46e7d}
- id: meta.subagent
  kind: field
  match: {file: subagents/*.meta.json, fields: [toolUseId, isFork, teamName, spawnDepth, stoppedByUser, 
        spawnedWithWorktree]}
  means: "A sub-agent's own record: who started it (toolUseId = Claude's call; isFork without it = the person), its team,
    how deep, whether the person stopped it, whether it got its own worktree."
  who_acts: either
  checked: {by: card audit 11-04, commit: dd76d2e8}
- id: att.hook_success
  kind: attachment
  match: {attachment_type: hook_success}
  means: "A hook ran and its output went into Claude's context: {command, hookName, stdout}. The only record that ties context
    text to a script."
  not: The person's own hook; own.hook decides.
  who_acts: setup
  checked: {by: proxify-d4 (who-did-it-rebuild), session: 3399b2bd}
- id: att.instructions
  kind: attachment
  match: {attachment_type: instructions}
  means: 'The rule files loaded at session start: files[{path, type, content}].'
  not: The person's own rule files; own.rule_file decides.
  who_acts: setup
  checked: {by: proxify-d4 (who-did-it-rebuild), session: 4d38c535}
- id: rec.history_command
  kind: record
  match: {history_display_starts_with: /}
  means: 'A command the person typed: history.jsonl entries whose display starts with /.'
  not: "Built in: the command may be a plugin's or their own; own.command decides."
  who_acts: person
  checked: {by: proxify-d4 (who-did-it-rebuild), session: 8c7fd67b}
- id: os.scheduler
  kind: os
  match: {crontab_or_launchagent_mentions: claude}
  means: A crontab or LaunchAgents entry that starts Claude Code.
  not: "Claude Code's own: the operating system's scheduler, the same on every Mac and Linux."
  who_acts: setup
  checked:

# ---------------------------------------------------------------- tool calls the cards count (Claude's own tools)
tools:
- id: tool.agent
  name: [Agent, Task]
  means: Claude started a sub-agent; subagent_type says which, model and isolation how.
  who_acts: claude
- id: tool.send_message
  name: SendMessage
  means: Claude sent a message to a sub-agent, a teammate or another session.
  who_acts: claude
- id: tool.task_stop
  name: TaskStop
  means: Claude stopped background work (a shell, a sub-agent or a workflow; the call doesn't say which).
  who_acts: claude
- id: tool.enter_plan_mode
  name: EnterPlanMode
  means: Claude asked to switch plan mode on.
  who_acts: claude
- id: tool.bash
  name: Bash
  means: Claude ran a shell command, in the foreground or (run_in_background) the background.
  who_acts: claude
- id: tool.monitor
  name: Monitor
  means: Claude watched a job until it ended.
  who_acts: claude

# ---------------------------------------------------------------- fixed sentences Claude Code writes
- id: tool.read
  name: Read
  means: Claude read a file.
  who_acts: claude
- id: tool.write
  name: [Write, Edit, MultiEdit, NotebookEdit]
  means: Claude wrote or edited a file.
  who_acts: claude
texts:
- id: text.interrupted
  match: '[Request interrupted by user'
  means: The person pressed Esc while Claude worked.
  who_acts: person
- id: text.cross_session
  match: ['Another Claude session sent a message', '<teammate-message', '<cross-session-message']
  means: A message from another session or a teammate arrived in this session.
  not: idle_notification and shutdown notices, which say nothing.
  who_acts: either

# ---------------------------------------------------------------- Claude Code's own folders
folders:
- {id: dir.agent_memory, match: [agent-memory, agent-memory-local, agent-memory-project], means: "Claude Code's memory folders
    for an agent (.claude/agent-memory*/)."}
- {id: dir.memory_md, match: MEMORY.md, means: "Claude Code's memory index file."}
- {id: dir.plugin_evals, match: [evals/, case.yaml], means: "The layout `claude plugin eval` reads. A run ledger (runs.jsonl)
    is not Claude Code's: the agentic kit's."}

# ---------------------------------------------------------------- what's the person's own: rules, never names
own:
- id: own.hook
  rule: A hook in their settings whose script sits in a repo where git shows their commits.
- id: own.rule_file
  rule: A CLAUDE.md, AGENTS.md or CLAUDE.local.md git shows they wrote.
- id: own.settings
  rule: A settings file (~/.claude/settings.json, a project's .claude/settings*.json) that ownership.py says is theirs; a teammate's committed file and managed settings are not.
- id: own.agent
  rule: An agent file (.claude/agents/*.md, a plugin's agents/) in a repo where git shows their commits.
- id: own.plugin
  rule: A plugin from their own marketplace. A plugin's source copy inside a kit repo is left out.
- id: own.command
  rule: A command or skill file they wrote (git). Counted as "a command of theirs", never by its name.

