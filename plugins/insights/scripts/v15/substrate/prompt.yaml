  pr-role-prefix, pr-metaprompt, pr-prompt-library, pr-ask-orientation, pr-own-wording, pr-name-defect) and the 3 practices (prompt-11, 12, 13) are in the crosswalk once; all playbook learn refs are in
  the materials index (and the pages say what the draft claims) and all outside refs are vocabulary source URLs; all 12 challenge terms SCOPE assigns here, plus right altitude, role prompting, plan mode
  and spec-driven development, are covered; the 10-27 quote exists in the manager memory; no member names. Rulings 4, 5, 11, row l3-s-06 and ''Pointing Claude at the right file'' match the level guide.'
