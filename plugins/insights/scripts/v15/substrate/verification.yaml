# Substrate v15 · discipline: Verification and evals. Drafted and checked 2026-11-02 (workflow wf_346397c1-980: opus draft, sonnet check). Model + rules: ../README.md
discipline:
  id: verification
  name: Verification and evals
  question: 'How do you know the agent''s work is right before it counts, and who can explain what shipped?'
  scope_note: 'Covers how the agent''s output gets checked: proof the agent has to show, a second look from a reviewer that didn''t write the work, the person reading and owning what ships. It also covers
    testing your own agent setup (prompts, rules, skills, sub-agents) with evals. Comprehension debt, automation bias, AI slop, vibe coding, cognitive surrender, skill atrophy and the 70% problem come from
    the vocabulary''s ''human'' family. They live here because the fix for them lives here. Not here: agreeing the plan and sizing the task (prompt), making a correction stick in the rules (context), what
    the agent may reach and the guardrails around it (harness; hooks show up here only as a technique), the meat proxy and babysitting (orchestration, though practices here handle both).'
challenges:
- id: false-done
  name: The agent says it's done when it isn't
  term: declaring done prematurely
  grade: single-source
  source: https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents
  vocab:
  - declaring-the-job-done-prematurely
  - laziness
  what_goes_wrong: The agent reports done, or 'all tests pass', without running anything end to end, testing the wrong layer, or leaving parts out (stubs, placeholders, skipped steps). The person finds
    the gap later.
  handled_by:
  - prove-it-works
  - second-look
  also_handled_in: []
  ask: 'The agent says it''s done and everything passes. Tell me about the last time that wasn''t true: how did you find out?'
  call_signs:
  - '''It said done and it wasn''t'': nothing had been run, the wrong layer was tested, or a step was skipped'
  - Takes the summary's word, or asks the same session 'does this look good?' (the level guide's L1 line)
  - Found stubs, placeholders or skipped parts after the agent said it had finished
  - Has to ask again for the parts it left out
  laptop_signs:
  - A check they built blocked the agent's first 'done'. On one laptop the first 'done' was blocked in 80 of 126 runs (no_backpressure.py).
  - Code commits with nothing run after the agent's last edit (comprehension_debt.py)
  - The person types 'not done', 'still missing' or 'you didn't run it' right after the agent finishes (English word list, a second signal only)
  - 'Not read today: placeholders or ''to do'' notes added in the agent''s last edits. The closest reading: a finish check they built refusing because parts were missing (no_backpressure.py).'
  detector: no_backpressure.py
  aliases:
  - declaring-done-prematurely
  - laziness
  seen_in: Level guide situation l2-s-08 ('Done, all tests pass', and it isn't), drawn from calls; the most common verification story.
- id: gamed-checks
  name: The agent makes the check pass instead of fixing the problem
  term: reward hacking
  grade: standard
  source: https://www.anthropic.com/research/emergent-misalignment-reward-hacking
  vocab:
  - reward-hacking
  - special-casing-tests
  what_goes_wrong: The agent gets to green by deleting or skipping the failing test, weakening what it checks, faking the thing under test, or writing code that only works for the test's inputs. The report
    says everything passes and the problem is still there.
  handled_by:
  - prove-it-works
  - second-look
  also_handled_in: []
  ask: Tell me about the last time the agent got a check to pass without really fixing the problem. How did you find out?
  call_signs:
  - 'Heard on a call: ''if you''re auto approving stuff, you end up removing test because they are not working. And it''s probably because something is actually broken.'''
  - Tells of a test the agent deleted, skipped or rewrote to go green
  - Found out only later, when the bug came back in real use
  - A fix that passed the tests and then failed on the first real input
  - Mentions hard-coded values, or a branch that only exists for the test
  laptop_signs:
  - After a failed check, the next step changed a test file instead of the code. The setup tool's Checking tab already counts 'changed the test'.
  - A test file edited in the same session just before the first passing run (not read separately today)
  - 'Not read today. Seeing it needs the final change compared against the test''s expected values. The closest reading: a check that failed 3+ times and then passed after a small edit (the doom_loop.py
    funnel count).'
  detector: null
  aliases:
  - reward-hacking
  - special-casing-tests
  pitfall:
    title: I believe 'done, all tests pass' from the agent that wrote the code
    fix: 'Before it starts, say what outcome proves the work: an end-to-end run, a migration that succeeds on a local copy, a preview you can click through. Ask the agent for that outcome and its proof
      (the command and its real output), not a story of its steps. Don''t let the agent change the test to make it pass, and tell it to report a wrong test instead of changing it.'
    order: 1
  seen_in: 'Heard on a call: auto-approving ends with the agent removing tests that fail because something is actually broken.'
- id: agents-word-wins
  name: The agent that wrote the work is the one that says it's fine
  term: automation bias
  grade: standard
  source: https://arxiv.org/html/2604.18948v1
  vocab:
  - automation-bias
  what_goes_wrong: The person asks the same chat 'does this look good?', or treats a confident summary or a green tick as the proof. An agent checking its own work praises it, and its word wins over the
    person's own doubt.
  handled_by:
  - second-look
  also_handled_in: []
  ask: Tell me about the last time the agent's answer and your own sense of the code disagreed. Which one won, and how did it turn out?
  call_signs:
  - Went with the agent's answer against their own doubt, and it turned out wrong
  - Treats 'tests pass' or the agent's summary as the proof
  laptop_signs:
  - 'Not separated today. It reads the same as comprehension debt: commits with nothing checked after the last edit.'
  - Tool calls the person rejected would show the opposite. They are in the logs but not read yet.
  detector: null
  aliases:
  - automation-bias
  seen_in: The level guide's L1 line for l2-s-08 ('ask the same chat does this look good'); a separate reviewer was v13's strongest verification signal (24/92 calls).
- id: shipped-unread
  name: Work ships that nobody read or can explain
  term: comprehension debt
  grade: emerging
  source: https://codemanship.wordpress.com/2025/09/30/comprehension-debt-the-ticking-time-bomb-of-llm-generated-code/
  vocab:
  - comprehension-debt
  - ai-slop
  - vibe-coding
  - cognitive-surrender
  - skill-atrophy
  what_goes_wrong: It works when clicked once, so it goes out. Underneath it touched files it shouldn't have or fixed the symptom, and the person can't walk through it. Teammates or the client end up doing
    the review, and every later change costs more.
  handled_by:
  - own-what-ships
  also_handled_in: []
  ask: Tell me about the last change the agent wrote that went out. How did you know it was right?
  call_signs:
  - Can't walk through one function of a change they shipped
  - '''If the tests pass and it works when I click around, I merge it'', and can''t say what the change did underneath'
  - 'Heard on a call: ''it made like 800 file changes. What''s the best way of verifying all the functionality'''
  - Teammates or the client sent agent work back for things one read would have caught
  - Opens pull requests straight from the agent without reading them first
  - Says some kinds of agent output go in unread (small fixes, config, copy). v13 counted this against them.
  - Pastes errors back to the agent without looking at the code
  - Can't say what they thought before asking the agent
  - The reason for a design choice is 'the agent suggested it'
  - Avoids working without the agent, or struggles to, even on small things
  - Can't take over a problem the agent couldn't solve
  laptop_signs:
  - Code commits with nothing run, shown or reviewed after the agent's last edit. Commits that only touch docs or notes are counted apart (comprehension_debt.py, not yet run on a laptop).
  - Commits within a minute of the last edit with nothing looked at in between, and whether a fix or revert on the same files followed within hours (checks.py)
  - Pull requests opened from a session with no look at the changes and no review after the last edit. Pull request links are in the logs; today only the text of the command that opens a pull request is
    read.
  - Commits with no look at the changes and nothing run after the agent's edits (checks.py, comprehension_debt.py)
  - 'Not read today. The closest markers are in the logs but unread: going back into planning after the agent''s plan, and saying no to a tool call.'
  - 'Not read today: how much code the person changed by hand rather than the agent. It is in the logs (files edited outside the agent) and in the file-history copies.'
  detector: comprehension_debt.py
  aliases:
  - comprehension-debt
  - ai-slop
  - vibe-coding
  - cognitive-surrender
  - skill-atrophy
  pitfall:
    title: The agent writes faster than I can review, so I skim and ship
    fix: 'Your attention is the bottleneck, so spend it on outcomes, not on every step. Decide up front what proves the change (a dry run on a local copy, a preview branch you see running, the result of
      a spike) and ask the agent to report those outcomes. Read line by line only where a mistake is costly: auth, money, data. Never pass on work you can''t explain.'
    order: 2
  seen_in: '11/92 calls say some agent output goes in unread; l2-s-07''s L1 line: ''I check if the results make sense, then commit''.'
- id: same-miss-again
  name: The same kind of defect comes back
  term: none
  grade: unnamed
  source: ''
  vocab: []
  what_goes_wrong: A defect in the agent's work gets caught and fixed by hand, but nothing would catch it next time, so the same kind of mistake ships again in a later session or a teammate's.
  handled_by:
  - turn-misses-into-checks
  also_handled_in: []
  ask: Tell me about a bug the agent made that you caught. What makes sure that one can't come back?
  call_signs: []
  laptop_signs: []
  detector: null
  seen_in: 51/92 calls name a specific defect the agent made; few say what stops it coming back (v13 Failure capture).
- id: setup-change-untested
  name: A change to the agent's instructions makes things worse and nobody notices
  term: none
  grade: unnamed
  source: ''
  vocab: []
  what_goes_wrong: The person edits a prompt, a rule file or a reviewer they set up, tries it once, and calls it fine. A case that used to work breaks and nobody finds out until it bites.
  handled_by:
  - retest-agent-setup
  also_handled_in: []
  ask: When you last changed a prompt, rule or helper agent, how did you know it didn't get worse? Name a case and what it checks.
  call_signs: []
  laptop_signs: []
  detector: null
  seen_in: On laptops, hundreds of edits to instruction files against a handful of eval runs; on calls evals are mostly a plan (a member call, 10-13).
- id: doom-loop
  name: The agent keeps trying the same failing fix
  term: doom loop
  grade: emerging
  source: https://codemanship.wordpress.com/2025/09/30/comprehension-debt-the-ticking-time-bomb-of-llm-generated-code/
  vocab:
  - doom-loop
  what_goes_wrong: The agent goes round in circles on a problem it can't solve. It tries one blind fix after another, often without running the code in between, or repeats the same error across sessions.
    The vocabulary's other fixes (starting clean, saving the correction where the next session reads it) belong to context.
  handled_by:
  - prove-it-works
  also_handled_in:
  - context:reset-with-a-handoff
  ask: Tell me about the last time the agent got stuck fixing something. What did you do?
  call_signs:
  - '''It kept going in circles'', and nothing about the approach changed'
  - Gave up on the task, or kept pasting the same error back
  - 'Describes breaking the loop: stopped it, named the real cause, changed the approach, or started clean'
  laptop_signs:
  - 'The same check failing 3+ times in a row with the same error, and edits aimed at that error (doom_loop.py). One laptop had none in 30 days: all 40 runs of 3+ failures were normal fix-and-retest, and
    a hand check of 13 held that up.'
  - Who broke each loop (the person stepping in, a reset, or the agent alone) and whether it ended in a passing run
  detector: doom_loop.py
  retired: true
practices:
- id: prove-it-works
  name: Make the agent show it works before it says done
  term: backpressure
  grade: emerging
  source: https://banay.me/dont-waste-your-backpressure/
  vocab:
  - backpressure
  audience: uses-agents
  what_you_do: 'Before the work starts, name the outcome that proves it (an end-to-end run, a migration on a local copy, the screen working). Then have the agent show that outcome, not its word: the real
    run and its output, or a test seen failing before and passing after. Pick the proof that fits the change; a count of tests is not the point.'
  handles:
  - false-done
  - gamed-checks
  also_handles: []
  ladder:
    L1: They take the agent's 'done' or 'all tests pass' at its word.
    L2: Each time, they name the outcome that proves the work and have the agent show it with its output, checking each step's result before the next on risky work and sending back any test the agent weakened.
    L3: 'Their setup makes the agent show proof without being asked: the project''s written rules say what proves a change here and how to run it, the agent can run and see the product, and checks run on
      every change, so a teammate''s session does the same.'
    L4: 'They built their own gate (a check, a hook or a runner) that won''t let work count as done until a check a script decides has passed, so unattended work proves itself, keep tuning the checks as their work changes, and re-running it on past false ''done''s shows it still catches them.'
  techniques:
  - tool: any
    how: 'Test first: the agent writes the test, runs it and shows it failing, then makes it pass. Tell it to report a wrong test, never change it to pass.'
    laptop_signal: A test, build or lint run after the agent's last edit and before the commit (comprehension_debt.py, checks.py). The fail-then-pass order is not read.
  - tool: any
    how: A quick live try (a spike) instead of a permanent test when the change doesn't need one to stay.
    laptop_signal: '''Ran a file it changed'' or ''ran a script of the project'' after the last edit (comprehension_debt.py)'
  - tool: any
    how: 'Give the agent eyes: let it run the app, call the endpoint, drive a browser or terminal, and show what it saw.'
    laptop_signal: '''Ran the app'' after the last edit: curl, localhost, browser automation, screenshots (comprehension_debt.py)'
  - tool: Claude Code
    how: Lines in the project CLAUDE.md saying how to run and read the checks here and that a passing run must be shown before handing back.
    laptop_signal: 'checks.py ''who made the check happen'': the repo''s instructions say to'
  - tool: Claude Code
    how: /goal with a condition the agent must meet before it stops.
    laptop_signal: /goal and its status in the session logs (scan, Sessions row)
  - tool: Claude Code
    how: 'Only for unattended runs (claude -p, Agent SDK, a loop script): a Stop hook or runner step that runs a check a script can decide and blocks the finish while it fails. Not as the definition of
      done in a session someone is watching (his ruling, 10-16).'
    laptop_signal: null
  - tool: any
    how: CI or pre-commit checks on every change, with the agent told to read their result.
    laptop_signal: null
  call_evidence: The agent says 'done, all tests pass'. What do you look at before you believe it? Tell me about a time it wasn't true.
  laptop_evidence: 'Share of code commits with a test, build, lint or a run of the app after the agent''s last edit (comprehension_debt.py, checks.py). Who made the check happen: the person asked (L2),
    the repo''s instructions (L3), a hook or program they wrote (L4). Refusals by checks they wrote, and whether the next try passed: on one laptop, 237 refusals in 30 days, 228 in runs nobody was typing
    in, and 43 of 82 blocked runs passed on the next try (no_backpressure.py). After a failed check, whether the next step was a fix and a green re-run or a changed test file (checks.py). Not seen: tests
    run by CI or git hooks, output read in the editor, the fail-then-pass order.'
  learn:
  - kind: playbook
    ref: /patterns/autonomous-tasks
    title: Autonomous Task Patterns
  - kind: playbook
    ref: /patterns/workflow-patterns
    title: Workflow Patterns
  - kind: playbook
    ref: /reference/common-pitfalls
    title: Common Pitfalls
  rulings:
  - '''Either a good testing strategy, or no testing at all (prefer spiking)'' (10-29): the level comes from the proof chosen for the change, never from how many tests exist.'
  - 'A check they wrote that refuses ''done'' is this practice''s top level only in runs nobody watches and only when a script can decide the outcome (10-16 hooks norm). Building it counts toward building
    (ruling 2: ''mostly L4''), but the level needs an eval (11-02: ''an eval, period'').'
  - 'Running a checking hook or plugin someone else wrote is L1: ''Using them is a L1 basic thing.'' Credit goes to whoever wrote the script (git).'
  practice_card:
    title: Name the outcome that proves it, then ask for that proof
    text: 'Before the work starts, say what result shows it is done: an end-to-end run, a migration that succeeds on a local copy, a preview you can click through. Ask for that result and its real output.'
    order: 2
  authors_note: 'Vocabulary moves merged here: backpressure; TDD with agents (write the failing test first, see it fail, then make it pass); ''audit each progress claim against a tool result''; ''verify
    packages exist before install''; ''a prompt asking for a general solution and to flag incorrect tests instead of working around them''; hidden or holdout tests at the top level (dropped from the level
    text by the 11-02 ruling: L4 needs an eval, whether the agent can edit it is not part of any level).'
  ladder_short:
    L2: Names the proof and has the agent show it each time
    L3: Writes down what proves a change, so every session shows it unasked
    L4: 'Builds, tunes and tests a gate that blocks ''done'' until checks pass'
  short_name: Make the agent show proof
  entry_rules: False 'done' is the most common verification story on calls (l2-s-08); asking for proof is a person's habit; it is about their own work.
- id: second-look
  name: Have the work checked by a reviewer that didn't write it
  term: generator/evaluator loop (Writer/Reviewer)
  grade: emerging
  source: https://www.anthropic.com/engineering/building-effective-agents
  vocab:
  - generator-evaluator-loop
  audience: uses-agents
  what_you_do: Before taking the work further, have it checked by something that never saw how it was made and can only read, not fix. Ask it what's wrong, then judge each finding yourself instead of passing
    it on.
  handles:
  - agents-word-wins
  - gamed-checks
  - false-done
  also_handles: []
  ladder:
    L1: The agent that wrote the work is the only one that checks it, and it says it's fine.
    L2: Each time, they hand the changes to a fresh session or a separate read-only reviewer, ask what's wrong, and judge each finding themselves.
    L3: 'Their setup gives every change a second look before a pull request without them remembering: a reviewer they set up, with what to look for and read-only access, that their usual flow calls.'
    L4: They built their own reviewer whose verdict decides when work moves on, with a cap on rounds, so it runs without them, keep tuning what it looks for as their work changes, and re-running it on past
      changes with known bugs shows it still finds them.
  techniques:
  - tool: any
    how: Paste the changes into a fresh session that never saw the work, ask what's wrong, judge each point.
    laptop_signal: null
  - tool: Claude Code
    how: A reviewer subagent in .claude/agents with read-only tools (Read, Grep, Glob), started before a pull request with a short brief.
    laptop_signal: 'Review sub-agents started after the last edit and before a commit (comprehension_debt.py ''review sub-agent''; scan: sessions with a review step); agents they wrote, credited by git'
  - tool: Claude Code
    how: A workflow with a build step and a separate verify step that only reads.
    laptop_signal: Workflow runs are counted; what runs inside them is not read
  - tool: any
    how: The team's AI review bot on pull requests, each comment judged before acting on it.
    laptop_signal: null
  call_evidence: Who or what checks the agent's work besides the session that wrote it? Tell me one thing that check caught that would have shipped.
  laptop_evidence: 'Review sub-agents started after the last edit and before a commit or pull request (comprehension_debt.py, scan); reviewer agents or skills they wrote, credited by git; refusals by a
    reviewer step inside a hook or runner they wrote (no_backpressure.py). Not seen: review on GitHub, a fresh session the changes were pasted into by hand, whether they judged the findings.'
  learn:
  - kind: playbook
    ref: /patterns/orchestration-patterns/builder-validator
    title: Builder-Validator Pairs
  rulings:
  - Using a review plugin or bot someone else wrote is L1 ('Using them is a L1 basic thing'). Calling it on each change and judging what it finds is the L2 act, the same as a fresh session.
  - 'A reviewer agent or skill they wrote is L3 (writing your own skills: ''L3'').'
  - 'Running a dynamic workflow that has a review phase is L2 (ruling 11: ''it''s an L2 thing''). Building their own program that runs builder and reviewer is L4.'
  practice_card:
    title: Get a second look from a reviewer that didn't write it
    text: Review in a brand-new session, with a different model, or with a read-only reviewer agent given a short brief ('find what is wrong, do not fix'). Let the coding agent resolve the comments in a
      loop, cap the rounds (three), and keep a human on the decision. Judge each finding yourself. It works especially well on front-end work.
    order: 5
  authors_note: 'Vocabulary moves merged here: generator/evaluator loop, evaluator-optimizer, Writer/Reviewer pattern, verification subagent, fresh-context reviewer, adversarial review step.'
  ladder_short:
    L2: Hands changes to a fresh, read-only reviewer and judges each finding
    L3: Sets up a reviewer that checks every change before a pull request
    L4: Builds, tunes and tests a reviewer whose verdict gates the work
  short_name: Get an independent second look
  entry_rules: Fires on 24/92 calls with v13's strongest verification signal (0.38); a person chooses and judges the review; own work.
- id: own-what-ships
  name: Read, run and be able to explain what ships
  term: cognitive offloading
  grade: 'standard (cognitive psychology since 2016; for AI its meaning is split: healthy delegation or over-reliance)'
  source: https://doi.org/10.1016/j.tics.2016.07.002
  vocab:
  - cognitive-offloading
  audience: uses-agents
  what_you_do: Hand over the typing, keep the decision. Before agent work reaches a teammate or client, read the actual changes, run them as a user would, and be able to explain any part; if you can't explain
    it, it doesn't ship. Write the costly parts yourself (auth, money, data migrations) or read them line by line, and form your own view before taking the agent's advice.
  handles:
  - shipped-unread
  also_handles: []
  ladder:
    L1: Agent work goes out once it looks right or the tests pass, and they can't say what it changed underneath.
    L2: Before it reaches anyone, they read the changes, run them like a user and can explain any part, writing or reading line by line the parts where a mistake is costly.
    L3: 'Their setup makes owning it the default: every agent change comes back with what changed, why, how it was proven and what to read first, in a format their teammates and reviewers also get.'
    L4: They built their own hand-back (what changed, why, how it was proven, what to read first) into how work leaves them so nothing reaches a reviewer without it, keep tuning it from what reviewers send
      back, and tracking those reverts shows unread work has stopped getting out.
  techniques:
  - tool: any
    how: Read all the changes before committing or opening a pull request; run the change yourself (click through it, call the API).
    laptop_signal: null
  - tool: any
    how: Ask the agent to quiz you on the change, and not to open the pull request until you can answer.
    laptop_signal: null
  - tool: any
    how: 'A standing hand-back format: what changed, why, how it was proven, what to look at first.'
    laptop_signal: null
  - tool: Claude Code
    how: 'The Learning output style: the agent leaves parts for you to write and explains its choices.'
    laptop_signal: 'Output styles in use (scan: What the agent knows)'
  call_evidence: 'Show me the last agent change you shipped. What did you check before it went out? Pick one function: what does it do?'
  laptop_evidence: 'Changes shown after the last edit and before the commit; commits straight after an edit with nothing looked at, and whether a fix or revert followed within hours (checks.py, comprehension_debt.py);
    pull requests opened from sessions. Not seen today: reading in the editor, edits by hand (in the logs as files edited outside the agent and in file-history copies, unread), whether they understood any
    of it. v13''s ''could defend every line'' was always ''ask'' on the laptop for this reason.'
  learn:
  - kind: playbook
    ref: /patterns/maturity-ladder
    title: The Maturity Ladder
  - kind: playbook
    ref: /reference/common-pitfalls
    title: Common Pitfalls
  rulings:
  - An unasked practice is the interviewer's choice of where to stop, never a gap (11-02). This practice is seen mostly on calls, so silence on the laptop is not L1.
  - 'L4 is null by design: understanding can''t be built into machinery. Checks the agent can''t skip belong to prove-it-works, second-look and retest-agent-setup.'
  practice_card:
    title: You own the architecture and the risky part; the agent fills in
    text: Decide structure, schema, library and the approach yourself, give the agent one finished example or reference, scope it to a folder, then delegate the repetitive or mechanical parts. For the most
      sensitive or judgement-heavy logic, write the pseudo-code or core yourself and have the agent write tests or sub-agents. Try alternative approaches yourself before accepting its first one. This is
      the platform work engineers have to engineer themselves.
    order: 9
  authors_note: 'The term is used only in the healthy sense (you keep the decision); many AI papers use it for the harmful kind. Vocabulary moves merged here: cognitive offloading; ''review the code before
    sharing it'' (AI slop); ''own the diff: read it before you ask anyone to review it'' and ''read it, understand it, validate it, then answer in your own words'' (meat proxy); ''practise without the agent'',
    ''coding without the agent on a schedule'' and the conceptual-inquiry style of asking (skill atrophy, comprehension debt); ''keep forming an independent view'' (cognitive surrender). The field''s umbrella
    for this is agentic engineering: the AI implements, the human owns architecture, quality and correctness.'
  ladder_short:
    L2: Reads, runs and can explain changes before they reach anyone
    L3: Gets every change back with what changed, why, and its proof
    L4: Builds, tunes and tests a hand-back that no change can skip
  short_name: Own what ships
  entry_rules: Reading before shipping fires on 60/92 calls and its absence on 11/92; only a person can own it; own work.
- id: turn-misses-into-checks
  name: Turn every defect that got through into a check that catches it next time
  term: none
  grade: unnamed
  source: ''
  vocab: []
  audience: uses-agents
  what_you_do: When a defect in the agent's work gets past 'done', fix it and add the check that would have caught it, so the same kind of mistake fails next time in anyone's session. A defect in how the
    agent behaves goes into the agent's saved cases instead (see retest-agent-setup).
  handles:
  - same-miss-again
  also_handles: []
  ladder:
    L1: The same kind of defect comes back, and they fix it by hand each time.
    L2: When they catch a defect in the agent's work, they fix it and, when they remember, have the agent add a test that fails without the fix.
    L3: 'Their setup does it every time: the project''s rules say every fix comes with a check that fails without it, so the agent adds one in any session, theirs or a teammate''s.'
    L4: They built their own step that turns each defect found after 'done' into a check that runs on every change without them, keep tuning it as the kinds of defect change, and their record shows that
      kind of defect has stopped coming back.
  techniques:
  - tool: any
    how: 'For each bug: reproduce it in a test, see the test fail, then fix; the test stays.'
    laptop_signal: null
  - tool: Claude Code
    how: 'A line in the project CLAUDE.md: every fix ships with a test that fails without it.'
    laptop_signal: null
  - tool: any
    how: A short log of defects caught after 'done', sorted by kind, read now and then to see which kinds still repeat.
    laptop_signal: null
  call_evidence: Tell me about a bug the agent made that you caught. What makes sure that one can't come back?
  laptop_evidence: ''
  learn:
  - kind: playbook
    ref: /patterns/system-evolution
    title: System Evolution
  rulings: []
  ladder_short:
    L2: Fixes each defect and, when they remember, adds a test for it
    L3: Makes it a project rule that every fix comes with a check
    L4: Builds, tunes and tests a step that turns escaped bugs into checks
  short_name: Turn missed bugs into checks
  entry_rules: Defects caught on 51/92 calls with little said about keeping them caught; adding the check is a person's habit; own work.
- id: retest-agent-setup
  name: Re-test your agent setup on saved cases (evals) after every change
  term: evals
  grade: standard
  source: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
  vocab:
  - evals
  audience: uses-agents
  what_you_do: 'When you change a prompt, a rule, or a reviewer or helper agent you set up, re-run a fixed set of cases and see whether it got better or worse, instead of trying it once. Build the cases
    from where the agent really went wrong: note each miss, sort them into kinds, and write cases for the kinds that matter. Grade with code where you can, and with a judging model checked against your
    own labels where you can''t.'
  handles:
  - setup-change-untested
  also_handles: []
  ladder:
    L1: They change a prompt, rule or helper agent, try it once, and call it fine.
    L2: After each change they re-try the same few saved tasks in a fresh session and compare with what they got before.
    L3: They keep a saved set of cases built from real misses, each with what a pass looks like, and a command anyone on the team can run re-checks the setup after a change.
    L4: They built their own harness that runs a saved set of cases on every change to the setup without them, keep growing the cases from new misses, and a drop in the result blocks the change, which is
      the proof the setup still holds.
  techniques:
  - tool: Claude Code
    how: Cases in evals/<case>/case.yaml run with claude plugin eval, wired to a package.json script or Makefile target the team can call.
    laptop_signal: null
  - tool: Claude Code
    how: A CI job on every push or pull request that runs claude plugin eval and fails the change on a drop (no '|| true', no continue-on-error).
    laptop_signal: null
  - tool: Claude Code
    how: Run cases headless (claude -p or the Agent SDK) from a script, each in a fresh copy, and compare with the last run.
    laptop_signal: Headless runs whose folder or command names an eval; eval commands; repos with an evals folder (scan.py; practices.py loop_23)
  - tool: any
    how: An eval tool such as promptfoo, Inspect, DeepEval or Braintrust.
    laptop_signal: Eval tool names in shell commands (scan.py)
  - tool: any
    how: Read where the agent went wrong in real sessions, sort and count the misses, write cases for the kinds that matter.
    laptop_signal: null
  call_evidence: When you last changed a prompt, rule or helper agent, how did you know it didn't get worse? Name a case and what it checks.
  laptop_evidence: 'Automated eval runs and eval commands, and repos with an evals folder (scan.py, practices.py); eval runs inside sandbox copies (no_backpressure.py). Not seen: who can write the eval,
    whether a drop blocked anything, whether the cases came from real failures.'
  learn:
  - kind: playbook
    ref: /reference/vocabulary
    title: Vocabulary
  rulings:
  - '''I think that to be an architect he needs to demonstrate architect things, including building any of tools, mcp, skills, and running evals'' (10-13).'
  - 'L4 needs evals, period: whether the agent can edit them is not part of the bar (11-02, replaces the 10-09/10-13 ''evals the agent can''t edit'').'
  authors_note: 'Vocabulary moves merged here: evals; error analysis (open and axial coding of real failures, single-source, so it names a step but never anchors a level); eval-driven development (write
    the eval before or with the change and gate on it); LLM-as-a-judge (a model grades open-ended output). People building agent products do the same thing at a larger scale. The can''t-edit condition on
    the cases and grader was dropped from the level text by the 11-02 ruling.'
  ladder_short:
    L2: Reruns a few saved tasks by hand after each change
    L3: Keeps cases from real misses and one command anyone can rerun
    L4: Builds and grows evals that run on every change and block drops
  short_name: Run evals on your setup
  trusted_checks:
  - 'retest-agent-setup L3 #2'
  - 'retest-agent-setup L4 #1'
  entry_rules: L4 overall needs an eval (10-13, 11-02) and laptops show setup edits without re-tests; a person runs them; only their own agent setup counts, not an AI feature they ship.
crosswalk:
- v13: loop-14
  to: prove-it-works
  why: Review gates split by what gets checked. Checking each step's result before the next stays here as the L2 level of prove-it-works. Reading the plan before the agent starts and handing over small
    pieces are hand-over moves, so they go to prompt (plan mode is a technique there).
- v13: lp-plan-gate
  to: 'prompt: agree the plan before the work'
  why: Reading the plan before the agent starts is how work is handed over. SCOPE puts plan mode under prompt as a technique, and 'Planning first is a Level 2 habit' (ruling 8).
- v13: lp-step-gate
  to: prove-it-works
  why: 'Checking one step''s result before the next starts is the by-hand level of the practice whose higher levels are a setup, then a gate, doing the checking (level guide l2-s-05: ''The run checks itself
    against a test it can''t edit, so nobody has to watch'').'
- v13: lp-small-batch
  to: 'prompt: one bounded task at a time'
  why: 'How big a piece goes to the agent is a hand-over decision (level guide l2-s-01: one bounded task; split it, prove the pattern on one piece, then do the rest).'
- v13: loop-15
  to: second-look
  why: Independent verification is the generator/evaluator (Writer/Reviewer) loop. Its agent-tests cue moves to prove-it-works.
- v13: lp-second-gate
  to: second-look
  why: Another agent reviewing the work before the person goes on is the Writer/Reviewer pattern. It was v13's strongest verification signal against the survey (0.38).
- v13: lp-agent-tests
  to: prove-it-works
  why: '''Has the agent handle the testing'' counts only as proof (a failing test first, the run shown), never as a tick: ''either a good testing strategy, or no testing at all (prefer spiking)'' (10-29).
    Its v13 signal against the survey was null.'
- v13: loop-16
  to: own-what-ships
  why: 'Output ownership means keeping the decision: read it, run it, be able to explain it.'
- v13: lp-keep-ownership
  to: own-what-ships
  why: Reading the agent's changes before they ship is the L2 level.
- v13: lp-verify-as-user
  to: own-what-ships
  why: The person running the change like a user is part of owning it. When the agent does the running (a browser, an API call) it is a technique of prove-it-works.
- v13: lp-graded-rope
  to: own-what-ships
  why: Writing the critical part yourself keeps the decision, and it is the vocabulary's defence against skill atrophy ('coding without the agent on a schedule').
- v13: lp-ship-unread
  to: vibe-coding
  why: Saying some output goes in unread is the challenge itself, not a practice. It reads as L1 on own-what-ships for that kind of work. Its positive survey link (0.40) is an open question.
- v13: loop-17
  to: own-what-ships
  why: Failure capture splits. Naming a real defect the agent made shows the person checks (own-what-ships). Sending it back with the defect named is a hand-over move (prompt). Making the correction stick
    in the rules is context. Turning it into a test that would have caught it is prove-it-works. Sorting and counting failures systematically is error analysis inside retest-agent-setup.
- v13: lp-caught-defect
  to: own-what-ships
  why: A specific defect the person found in the agent's work is evidence that they read and run what ships.
- v13: lp-report-back
  to: 'prompt: send it back with the defect named'
  why: Taking the problem back to the agent shapes the next ask (level guide l2-s-06). It is the same move as v13 prompt-13's 'names the defect'.
- v13: loop-23
  to: retest-agent-setup
  why: Running evals on your own agent setup is the evals practice. Error analysis, eval-driven development and LLM-as-a-judge merge into it.
- v13: lp-eval-suite
  to: retest-agent-setup
  why: The detection text carries over (own agent tooling only; grading unrelated content or asking for suggested cases doesn't count). The L4 level now also needs the agent unable to edit the eval.
open_questions:
- 'Content gap: no playbook page or hands-on station teaches evals for your own agent setup: building cases from real failures, a judging model checked against your labels, keeping the eval out of the agent''s
  reach. /reference/vocabulary only defines evals, LLM-as-a-judge and error analysis, so retest-agent-setup has outside material only. The kit''s agentic-engineering ''evals'' skill exists but isn''t in
  the materials index.'
- 'Content gap: nothing teaches the defences against skill atrophy and cognitive surrender (practise without the agent, form your own view first, have it explain before you accept), and no page teaches
  having the agent quiz you on a change before the pull request (the checker removed /patterns/prompting-craft from own-what-ships because it has no such passage). own-what-ships leans on general review
  pages plus outside articles.'
- 'Content gap: no page covers hidden or held-out tests, or keeping tests out of the agent''s reach (special-casing tests, reward hacking). No page covers checking a dependency exists before install (package
  hallucination).'
- 'Ruling needed: v13 counted any eval suite toward L4 (badge ''evals'', 10-13). This draft puts a saved eval set the agent could edit at L3, and only an eval the agent can''t edit at L4 (''L4 needs evals
  the agent can''t edit''). Confirm the split.'
- 'Ruling needed: v13''s ''ship-unread'' (admits some agent output goes in unread) was scored negative, yet it had the strongest positive link to the survey in the loop badge (0.40, n=8). Is a stated, scoped
  risk call (''I don''t read copy or config changes'') a strategy he accepts, like ''no testing at all, prefer spiking'', or is it vibe coding?'
- 'Ruling needed: is a reviewer agent or skill they wrote L3 (like writing skills), with only a reviewer the agent can''t get past, built into a hook or runner, at L4? The draft reads it that way.'
- 'Ruling needed: when checks on every change exist in a client repo the person didn''t set up, does that count as their L3 on prove-it-works? The draft credits it only if they set it up or told the agent
  to read the result.'
- 'Unsourced links, flagged: laziness → prove-it-works (the vocabulary lists no fix for laziness), and 70% problem → own-what-ships (the vocabulary''s only fix is the umbrella ''agentic engineering'').
  SCOPE assigns the ''agentic engineering'' move nowhere. Here it is read as the field''s umbrella, and its ''human owns quality and correctness'' part is mapped to own-what-ships.'
- 'Placement to settle: the level guide files ''checks each step before the next'' under L2-B ''steers it while it works''. Here it is the by-hand level of prove-it-works. If the prompt or orchestration
  draft claims steering, pick one home.'
- 'Cross-discipline ids: the crosswalk targets in prompt (''agree the plan before the work'', ''one bounded task at a time'', ''send it back with the defect named'') are written as descriptions. Reconcile
  them with the prompt draft''s ids at merge. The same applies to the also_handles terms, which use vocabulary wording.'
- 'Laptop gaps: comprehension_debt.py has no result yet (it hasn''t been run on the laptop). Not read today although the data exists: tests run by CI or git hooks, the fail-then-pass order, review on GitHub,
  hand edits (files edited outside the agent, file-history copies), rejected tool calls and going back into planning. These would give own-what-ships, cognitive surrender and skill atrophy their first laptop
  signal.'
- 'Grade field: cognitive offloading''s grade is copied exactly from the vocabulary, parenthetical included, as the field rules require. If the merge step expects one word only, it reduces to ''standard''.'
- 'Link to confirm: special-casing-tests → retest-agent-setup is ours. The vocabulary''s fixes for it (hidden or holdout tests; a prompt asking for a general solution and to flag wrong tests) are both merged
