- 'CHECK open_questions: added a ''Rule 1 reading'' question, because the three builds-agents practices are named by single-source terms and have only an L4 level (single-source terms may name but never
  anchor a level).'
- 'CHECK no other change needed: all 25 challenge terms, grades and sources, and all 11 practice terms, grades and sources, match the vocabulary entries exactly; handled_by and handles agree in both directions
  and cover every ''Fixed by'' link (context rot''s ''Fixed by'' ends in own your context window, context folding, RLMs, sleep-time compute and the Ralph loop, all covered); every learn ref is in the materials
  index or is a vocabulary source URL; the crosswalk holds context-7 to context-11 and all 55 of their surfaces and cues once each (checked against practices.yaml); no practice name has a tool name or a
  virtue; no member names; no SCOPE term is missing.'
- v13's five context practices (context-7 to context-11) become nine practices for people who use agents and three for people who build them, grouped around 25 sourced challenges plus one unnamed one (starts
  from zero).
- 'Session management (context-9) is split by what it actually heard: fresh sessions, compacting a session, exploration, and pointing at files. All of it stays Level 2, carried into Level 3.'
- Instruction scoping (context-8) is split into 'where and when it loads' (progressive disclosure) and 'trim and retire' (context pruning), so a recommendation can name the specific gap.
- 'Agent-written rules files are no longer negative: ruling 5 makes them count when supervised.'
- Going back to one existing session (ctx-one-thread) is now read as the context-rot symptom, not as a plus.
