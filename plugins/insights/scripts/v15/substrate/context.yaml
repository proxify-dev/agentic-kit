open_questions:
- 'Ruling needed: 25 challenges are too many to ask about on a call or read from a laptop. Proposal: keep about 11 as challenges (context rot, context poisoning, context pollution, kitchen sink session,
  lost in conversation, lobotomization, summary drift, instruction drift, prompt bloat, instruction stacking, starts from zero, context confusion). Fold the rest in as other names under a parent: attention
  budget, attention dilution, real context size and dumb zone under context rot; trajectory poisoning under context poisoning; context collapse under summary drift; context distraction, context inertia
  and instruction-induction conflict under context pollution or poisoning. Drop agent drift: no fix is named, the only source is a simulation, and only its abstract was read.'
- 'Ruling needed: are sub-agents someone defined themselves (their own agent files) Level 3, like their own skills (ruling 4)? Drafted that way in isolate-side-work L3, by analogy only.'
- 'Level guide conflict: row 7 rejects ''a note the next session is told to open'' as Level 3, while row 9 accepts ''a goal or plan file that the next session reads''. Drafted: told to open = L2, read on
  its own = L3. Please confirm.'
- 'Level guide row 10 puts ''No hand-written handoff notes'' in the Level 2 line, while the playbook''s Session Management page teaches a handoff file as the main move. Drafted: a handoff they write by
  hand each time = L2, one their setup writes = L3. Do hand-written handoffs count at Level 2?'
- Ruling 6 (pruning) is still parked. keep-always-loaded-small's L3 is drafted as asked but not required for Level 3.
- 'Playbook conflict: The Self-Improving Loop and System Evolution teach ''tell the agent to update its rules file after every correction'' with no supervision rule. That teaches instruction stacking, and
  ruling 5 says agent-written rules count only under tight rules on what goes in. Both pages need that line and a step for retiring rules.'
- 'Playbook conflict: System Evolution says ''If a rule keeps getting violated, promote it to a hook.'' This contradicts his note on level guide row 6 (''Stop saying a written rule gets ignored = it becomes
  a hook. Nobody''s doing that.'').'
- 'Playbook conflict: Context Management, Common Pitfalls and Workflow Patterns say ''compact between tasks'', while Session Management says a new task gets a new session, and the level guide''s Level 1
  line is ''compact again and again''. Pick one answer.'
- 'Content gaps (nothing in the materials index teaches these): recovering from a poisoned session by going back to before the wrong turn (Session Management only has a paragraph on forking); lost in the
  middle and keeping a plan file the agent rewrites; finding why a written rule is ignored, and retiring rules (row 6); notes in a chosen shape that a fresh session reads on its own (only the onboarding
  page''s memory-folder step); a knowledge store the agent searches first (ruling 10); and every builds-agents practice (outside sources only). The Explore Memory page lists plugins (using them is Level
  1) but doesn''t teach the practice. The hands-on track covers only the first rules file and the first skill.'
- 'Term grades: reset-with-a-handoff rests on ''context reset'' (single-source), so its levels rest on the level guide, not on the term. It is Level 2 and carried, so it anchors no level. The notes practice
  is named by ''context offloading'' (emerging) because ''structured note-taking (agentic memory)'', the field''s most-cited name for the across-sessions half, is single-source and may name but not anchor
  Level 3. Is this the intended reading of rule 1?'
- 'Rule 1 reading: the three builds-agents practices (design-the-context-you-send, agent-managed-memory, long-input-in-pieces) are each named by a single-source term and their only level is L4. They are
  drafted as the SCOPE file assigns them, but single-source terms may name and never anchor a level, so their L4 levels rest on the L4 rulings (building that changes how the agent runs, plus evals the agent
  can''t edit), not on the term. Please confirm.'
- '''Own your context window'' is drafted as builds-agents, because its definition is about the message format of agents you build, though SCOPE listed it among the user practices. API-only moves (tool
  result clearing, Tool Search Tool, programmatic tool calling) are merged into user practices as techniques, since Claude Code does the first two automatically. ''Context folding'' needs a specially trained
  model, so it is builds-agents. Please confirm.'
- The fresh-session test (level guide row 16, 'applies to every row') is drafted as how every level is checked, not as a practice. Its automated form, evals the agent can't edit, belongs to verification.
  Please confirm.
- 'Laptop gaps: no laptop sign at all for lost in the middle, context clash, context anxiety, instruction-induction conflict, context inertia, attention dilution or agent drift; these are call-only. Markers
  already in the logs but not read: files carried into a compacted session, which plugin or skill made each write (did they or a tool write the note), and the plans folder. Subfolder files that loaded mid-session
  are read by the prompt-bloat check but not by the scanner. Memory is matched by folder name, so notes.md scores zero.'
- 'One-laptop results (the owner''s machine, 30 days): context rot doesn''t show (handled in the moment, L2); context poisoning can''t tell (only 6 of 18 hand-read streaks were the same wrong thing); prompt
  bloat doesn''t show (L3: small always-loaded files and subfolder rules); starts from zero shows L3 in one project and L2 in the others. The context-rot signal sees the person''s reaction, not answer quality.
  Run a second and third machine before any challenge here is read from a laptop alone.'
- 'Crosswalk calls to confirm: ctx-cost goes to the attention-budget challenge (a stance, credited only through the act it changes); ctx-screenshot and ctx-outside-data go to let-the-agent-fetch L2, which
  overlaps with the prompt discipline''s ''show it the real thing'' (level guide L2 row 3). The prompt draft should say which one owns them.'
checker_changes:
- 'CHECK reset-with-a-handoff L4: added ''A test the agent can''t edit shows the next session picks up the saved state.'' Enforces SCOPE ruling ''L4 needs demonstrable building that changes how the agent
  runs, AND evals it can''t edit (10-09, 10-13)''; the draft''s L4 had building but no check.'
- 'CHECK share-the-setup-with-the-team L4: replaced ''or guardrails that make dangerous actions impossible for every teammate''s agent'' with ''with a check the agent can''t edit showing that a fresh clone
