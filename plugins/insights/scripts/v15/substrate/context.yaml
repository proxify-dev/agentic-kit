- id: design-the-context-you-send
  name: Design the context your own agent sends the model
  term: own your context window
  grade: single-source
  source: https://github.com/humanlayer/12-factor-agents/blob/main/content/factor-03-own-your-context-window.md
  vocab:
  - own-your-context-window
  audience: builds-agents
  what_you_do: For an agent they build, they decide the format of what goes to the model, rather than a default session transcript. They do it for information density, error handling and cost. They keep
    a stable opening with history that is only appended to, so the cache keeps hitting. They mask tools instead of adding or removing them mid-run.
  handles:
  - context-rot
  also_handles: []
  ladder:
    L2: null
    L3: null
    L4: Their agent builds its own context format (stable opening, append-only history, errors condensed), and they measure cache hits and quality with evals.
  techniques:
  - tool: any
    how: 'Agent SDK or API: their own message format, prompt-caching breakpoints and a fixed prefix.'
    laptop_signal: Scripts they wrote that start agents (what they send the model is not read)
  - tool: any
    how: Mask tool choices while the model writes its answer, or use a fixed set of tool states, instead of changing the tool list mid-run.
    laptop_signal: null
  call_evidence: 'Ask only someone who builds agents: ''Show me what your agent actually sends the model on one turn, and why it''s shaped that way.'''
  laptop_evidence: Scripts or programs they wrote that start agents. What those send the model is not read.
  learn:
  - kind: outside
    ref: https://github.com/humanlayer/12-factor-agents/blob/main/content/factor-03-own-your-context-window.md
    title: '12-Factor Agents, factor 3: own your context window'
  - kind: outside
    ref: https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus
    title: 'Context engineering for AI agents: lessons from building Manus'
  rulings:
  - 'L4 needs building that changes how the agent runs, plus evals, period: whether the agent can edit them is not part of the bar (11-02, replaces 10-09/10-13).'
  authors_note: Merges own your context window, design around the KV-cache, and mask, don't remove.
  ladder_short:
    L4: Their own agent's context format, measured with evals
  short_name: Shape your agent's context
  retired: true
  track: agent-builders
- id: agent-managed-memory
  name: Build your agent's memory as a curated store it updates in small edits
  term: Agentic Context Engineering (ACE)
  grade: single-source
  source: https://arxiv.org/abs/2510.04618
  vocab:
  - agentic-context-engineering
  audience: builds-agents
  what_you_do: For an agent they build, memory is a system. It can be an evolving playbook updated by small, structured edits after each run instead of being rewritten whole. It can be tiers of fast and
    slow memory that the agent moves data between. It can be work done ahead of time between requests.
  handles:
  - context-collapse
  - context-rot
  - starts-from-zero
  - notes-pile-up
  also_handles: []
  ladder:
    L2: null
    L3: null
    L4: Their agent keeps and curates its own memory across runs by a mechanism they built, and evals show the memory helps rather than drifts.
  techniques:
  - tool: any
    how: Small updates to a playbook file after each run, with a separate step that curates it.
    laptop_signal: null
  - tool: any
    how: 'Memory tiers: a small core kept in context, and an archive the agent searches.'
    laptop_signal: null
  - tool: any
    how: A background job that prepares summaries or answers between sessions.
    laptop_signal: Schedules and scripted runs
  call_evidence: 'Ask only someone who builds agents: ''How does your agent''s memory change after a run, and how do you know it got better rather than worse?'''
  laptop_evidence: Scheduled or scripted runs they wrote. What those runs do to memory is not read.
  learn:
  - kind: outside
    ref: https://arxiv.org/abs/2510.04618
    title: Agentic Context Engineering (ACE)
  - kind: outside
    ref: https://arxiv.org/abs/2310.08560
    title: 'MemGPT: virtual context management'
  - kind: outside
    ref: https://arxiv.org/abs/2504.13171
    title: Sleep-time compute
  rulings:
  - 'Level guide row 8: ''They build memory systems, which the program doesn''t teach'' is where Level 4 starts.'
  authors_note: Merges ACE (evolving playbooks), virtual context management (MemGPT memory tiers) and sleep-time compute.
  ladder_short:
    L4: Their agent curates its own memory; evals show it helps
  short_name: Memory for an agent you build
  retired: true
  track: agent-builders
- id: long-input-in-pieces
  name: Have your agent work through long input in pieces
  term: Recursive Language Models (RLMs)
  grade: single-source
  source: https://arxiv.org/abs/2512.24601
  vocab:
  - recursive-language-models
  audience: builds-agents
  what_you_do: For agents they build that face more input than works in one context, the model treats the input as something outside itself. It examines the input with code and calls itself on pieces of
    it. Or it branches into a subtask and folds the result back into a short summary.
  handles:
  - context-rot
  also_handles: []
  ladder:
    L2: null
    L3: null
    L4: Their agent splits long input and calls itself on the pieces, or folds subtasks back into summaries, and they measure it against a single long context with evals.
  techniques:
  - tool: any
    how: The long input is a variable in a code environment the model can inspect, split, and call itself on.
    laptop_signal: null
  - tool: any
    how: Branch-and-return subtasks that keep only a short result (needs a model trained for it).
    laptop_signal: null
  call_evidence: 'Ask only someone who builds agents: ''What does your agent do when the input is bigger than its context can handle well?'''
  laptop_evidence: Not read.
  learn:
  - kind: outside
    ref: https://arxiv.org/abs/2512.24601
    title: Recursive Language Models
  - kind: outside
    ref: https://arxiv.org/abs/2510.11967
    title: Context folding
  rulings:
  - 'L4 needs building that changes how the agent runs, plus evals, period: whether the agent can edit them is not part of the bar (11-02, replaces 10-09/10-13).'
  authors_note: Merges RLMs and context folding (which needs a model trained for it).
  ladder_short:
    L4: Their agent splits long input; evals compare it to one pass
  short_name: Long input, handled in pieces
  retired: true
  track: agent-builders
